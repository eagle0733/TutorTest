<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學力原點 | 高端教學紀錄儀表板</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --primary: #4f46e5; --student: #fbbf24; --teacher: #10b981; --bg: #f3f4f6; }
        body { background: var(--bg); font-family: 'PingFang TC', sans-serif; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 600px; background: white; border-radius: 40px; box-shadow: 0 30px 60px rgba(0,0,0,0.1); overflow: hidden; }
        
        /* Header Style */
        .header { background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); padding: 30px; color: white; text-align: center; }
        .header h2 { margin: 0; font-size: 1.8rem; letter-spacing: 2px; }
        
        .main-content { padding: 30px; }
        .section-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 25px; padding: 25px; margin-bottom: 25px; transition: 0.3s; }
        .section-card:hover { border-color: var(--primary); box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .title-tag { display: inline-block; padding: 5px 15px; border-radius: 10px; font-weight: 800; font-size: 0.8rem; margin-bottom: 15px; text-transform: uppercase; }
        
        /* 量化滑桿樣式 */
        .slider-group { margin: 20px 0; }
        input[type=range] { width: 100%; height: 8px; border-radius: 5px; background: #d1d5db; outline: none; -webkit-appearance: none; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; background: var(--primary); border-radius: 50%; cursor: pointer; }
        
        .select-input { width: 100%; padding: 15px; border-radius: 15px; border: 2px solid #f3f4f6; font-size: 1rem; font-weight: 600; }
        textarea { width: 100%; border-radius: 15px; border: 2px solid #f3f4f6; padding: 15px; font-family: inherit; resize: none; }
        
        .btn-submit { width: 100%; padding: 22px; background: var(--primary); color: white; border: none; border-radius: 25px; font-weight: 900; font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.3s; }
        .btn-submit:hover { background: #4338ca; transform: translateY(-3px); }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h2>Eric 顧問教學紀錄</h2>
        <p style="opacity: 0.8;">每一堂課，都是一次精準的校準</p>
    </div>

    <div class="main-content">
        <div class="section-card" style="border-left: 8px solid #cbd5e1;">
            <label style="font-weight: 900;">👤 選擇今日授課學生</label>
            <select id="sInfo" class="select-input" style="margin-top:10px;">
                <option value="">點擊選擇...</option>
                <option value="吳芮瑀" data-grade="國一">吳芮瑀 (國一)</option>
                <option value="許恩碩" data-grade="國一">許恩碩 (國一)</option>
                <option value="張棨富" data-grade="國二">張棨富 (國二)</option>
                <option value="王竑傑" data-grade="國小">王竑傑 (國小)</option>
                <option value="程議正" data-grade="國一">程議正 (國一)</option>
                <option value="黃子恩" data-grade="國小">黃子恩 (國小)</option>
                <option value="吳宥彥" data-grade="國三">吳宥彥 (國三)</option>
                <option value="子祐" data-grade="國一">子祐 (國一)</option>
            </select>
        </div>

        <div class="section-card" style="border-left: 8px solid var(--student); background: #fffcf0;">
            <span class="title-tag" style="background: #fef3c7; color: #b45309;">Student Reflection 學生自評</span>
            <div class="slider-group">
                <label>1. 觀念理解信心度：<span id="v1">5</span>/10</label>
                <input type="range" id="sConf" min="1" max="10" value="5" oninput="v1.innerText=this.value">
            </div>
            <div class="slider-group">
                <label>2. 今日專注能量值：<span id="v2">5</span>/10</label>
                <input type="range" id="sFocus" min="1" max="10" value="5" oninput="v2.innerText=this.value">
            </div>
            <label>3. 今日最有成就感的地方？</label>
            <textarea id="sBest" rows="2" placeholder="例：我終於搞懂比例式的列式了！"></textarea>
        </div>

        <div class="section-card" style="border-left: 8px solid var(--teacher); background: #f0fdf4;">
            <span class="title-tag" style="background: #dcfce7; color: #166534;">Teacher Insight 老師觀察</span>
            <label>今日授課單元</label>
            <input type="text" id="progress" class="select-input" style="margin-bottom: 15px;" placeholder="單元名稱">
            
            <div class="slider-group">
                <label>吸收轉化率：<span id="v3">50</span>%</label>
                <input type="range" id="tMastery" min="0" max="100" step="10" value="50" oninput="v3.innerText=this.value">
            </div>
            <label>核心弱點精準描述</label>
            <textarea id="tWeak" rows="3" placeholder="老師點評其邏輯或計算上的特定問題..."></textarea>
        </div>

        <div class="section-card" style="border-left: 8px solid var(--primary);">
            <span class="title-tag" style="background: #e0e7ff; color: #4338ca;">Mission 課後任務</span>
            <textarea id="todo" rows="3" placeholder="請列出下次上課前需完成的具體任務..."></textarea>
        </div>

        <button class="btn-submit" onclick="submitDaily()">
            生成深度紀錄並通知家長 <i class="fas fa-paper-plane"></i>
        </button>
    </div>
</div>

<script>
    function submitDaily() {
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwsIzKsk-y25Fp0SF-Y0FU7d6cp4dzw76n8hk3N-poQ3-nygp7KzEG_KI2XLTlJGFAUIA/exec';
        const select = document.getElementById('sInfo');
        const selectedOption = select.options[select.selectedIndex];
        
        if(!select.value) return alert("請先選擇學生！");

        // 計算今日戰鬥力指數 (量化結果)
        const sScore = (parseInt(document.getElementById('sConf').value) + parseInt(document.getElementById('sFocus').value)) / 2;
        const tScore = parseInt(document.getElementById('tMastery').value) / 10;
        
        const data = {
            name: select.value,
            grade: selectedOption.getAttribute('data-grade'),
            progress: document.getElementById('progress').value,
            sScore: sScore,
            tScore: tScore,
            weakness: "【成就感】：" + document.getElementById('sBest').value + "\n【老師觀察】：" + document.getElementById('tWeak').value,
            todo: document.getElementById('todo').value,
            type: "DAILY_FEEDBACK"
        };

        const btn = document.querySelector('.btn-submit');
        btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 數據計算中...';

        fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) })
        .then(() => { 
            alert("✅ " + data.name + " 的 100 分紀錄已成功同步！"); 
            location.reload(); 
        });
    }
</script>
</body>
</html>
