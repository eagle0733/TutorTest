<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學力原點 | 課後即時診斷</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --primary: #4f46e5; --bg: #f8fafc; --card: #ffffff; --accent: #f59e0b; }
        body { background: var(--bg); font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; padding: 15px; margin: 0; display: flex; justify-content: center; min-height: 100vh; }
        .app-container { width: 100%; max-width: 550px; background: var(--card); padding: 30px; border-radius: 35px; box-shadow: 0 20px 50px rgba(0,0,0,0.08); margin: 20px 0; }
        .header { text-align: center; margin-bottom: 30px; border-bottom: 2px solid #f1f5f9; padding-bottom: 20px; }
        .header h2 { margin: 0; color: #1e293b; font-size: 1.6rem; letter-spacing: 1px; }
        .section-box { background: #f8fafb; padding: 20px; border-radius: 20px; margin-bottom: 25px; border-left: 6px solid var(--primary); }
        .student-part { background: #fffbeb; border-left-color: var(--accent); }
        .section-title { font-weight: 800; color: #1e293b; margin-bottom: 15px; display: block; font-size: 1rem; }
        label { display: block; font-weight: 700; margin-bottom: 8px; color: #475569; font-size: 0.9rem; }
        input, textarea, select { width: 100%; padding: 14px; border: 2px solid #e2e8f0; border-radius: 14px; font-size: 1rem; box-sizing: border-box; transition: 0.3s; background: white; }
        input:focus, textarea:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1); }
        .score-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .btn-submit { width: 100%; padding: 20px; background: var(--primary); color: white; border: none; border-radius: 20px; font-weight: 800; font-size: 1.1rem; cursor: pointer; margin-top: 10px; box-shadow: 0 10px 20px rgba(79, 70, 229, 0.2); transition: 0.3s; }
        .btn-submit:active { transform: scale(0.98); }
        .hint { font-size: 0.75rem; color: #94a3b8; margin-top: 4px; }
    </style>
</head>
<body>
<div class="app-container">
    <div class="header">
        <h2 style="color: #1e1b4b;"><i class="fas fa-file-signature"></i> 課後成長紀錄卡</h2>
        <p style="color: #64748b; font-size: 14px; margin-top: 8px;">建立教學透明度，追蹤每一堂課的成長軌跡</p>
    </div>

    <div class="input-group" style="margin-bottom: 25px;">
        <label>選擇學生與年級</label>
        <select id="sInfo">
            <option value="" data-grade="">點擊選擇學生...</option>
            <option value="陳同學" data-grade="國三">陳同學 (國三)</option>
            <option value="林同學" data-grade="國二">林同學 (國二)</option>
            <option value="張同學" data-grade="國一">張同學 (國一)</option>
            <option value="王同學" data-grade="國小">王同學 (國小)</option>
        </select>
    </div>

    <div class="section-box student-part">
        <span class="section-title" style="color: #b45309;"><i class="fas fa-user-graduate"></i> 學生深度自評</span>
        <div class="score-grid">
            <div class="input-group">
                <label>今日信心 (1-10)</label>
                <input type="number" id="sScore" min="1" max="10" placeholder="你的感覺">
            </div>
            <div class="input-group">
                <label>難度感覺 (1-10)</label>
                <input type="number" id="diffScore" min="1" max="10" placeholder="題目難度">
            </div>
        </div>
        <div class="input-group" style="margin-top: 15px;">
            <label>今天哪個「環節」最卡關？</label>
            <textarea id="sComment" rows="2" placeholder="學生填寫：例如公式轉換、文字題理解..."></textarea>
        </div>
    </div>

    <div class="section-box">
        <span class="section-title"><i class="fas fa-chalkboard-teacher"></i> 老師專業觀察</span>
        <div class="input-group">
            <label>今日進度單元</label>
            <input type="text" id="progress" placeholder="如：圓冪定理深度應用">
        </div>
        <div class="input-group" style="margin-top: 15px;">
            <label>老師觀察掌握度 (1-10)</label>
            <input type="number" id="tScore" min="1" max="10" placeholder="實測分數">
            <p class="hint">根據課堂練習與提問表現評分</p>
        </div>
        <div class="input-group" style="margin-top: 15px;">
            <label>關鍵弱點與教學對策</label>
            <textarea id="weakness" rows="3" placeholder="老師填寫：學生雖然公式熟，但遇到圖形翻轉容易反應不及，已要求加強..."></textarea>
        </div>
    </div>

    <div class="input-group" style="margin-bottom: 20px;">
        <label><i class="fas fa-tasks"></i> 下次上課前任務 (Todo)</label>
        <textarea id="todo" rows="3" placeholder="1. 講義 P.20-25&#10;2. 錯題本紀錄"></textarea>
    </div>

    <button class="btn-submit" onclick="submitDaily()">產出紀錄並通知家長 <i class="fas fa-magic"></i></button>
</div>

<script>
    function submitDaily() {
        // 使用您最新的 GAS 網址 (Xr7w 版本)
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwNzCSXdtN9LH56HO_qNt4SQd60dxiApZA8d0P3uSa3RNTv51LIu3M0EQTSE3GbpX0r7w/exec';
        
        const select = document.getElementById('sInfo');
        const selectedOption = select.options[select.selectedIndex];
        
        const data = {
            name: select.value,
            grade: selectedOption.getAttribute('data-grade'),
            progress: document.getElementById('progress').value,
            sScore: document.getElementById('sScore').value,
            tScore: document.getElementById('tScore').value,
            // 將學生反饋與老師點評整合傳送
            weakness: "【學生自評】：難度 " + document.getElementById('diffScore').value + " 分，卡關點：" + document.getElementById('sComment').value + "\n【老師點評】：" + document.getElementById('weakness').value,
            todo: document.getElementById('todo').value,
            type: "DAILY_FEEDBACK"
        };

        if(!data.name || !data.progress || !data.sScore || !data.tScore) {
            return alert("請完整填寫紀錄內容 (包含學生評分與老師觀察)！");
        }
        
        // 顯示按鈕讀取狀態
        const btn = document.querySelector('.btn-submit');
        btn.disabled = true;
        btn.innerHTML = '正在傳送... <i class="fas fa-spinner fa-spin"></i>';

        fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) })
        .then(() => { 
            alert("✅ 紀錄成功！教學紀錄卡已同步發送至家長信箱。"); 
            location.reload(); 
        })
        .catch(err => {
            alert("發送失敗，請檢查網路！");
            btn.disabled = false;
            btn.innerHTML = '產出紀錄並通知家長 <i class="fas fa-magic"></i>';
        });
    }
</script>
</body>
</html>
