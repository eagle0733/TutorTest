<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學力原點 | 課後即時診斷</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --primary: #4f46e5; --bg: #f8fafc; --card: #ffffff; --accent: #f59e0b; }
        body { background: var(--bg); font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; padding: 15px; margin: 0; display: flex; justify-content: center; min-height: 100vh; }
        .app-container { width: 100%; max-width: 550px; background: var(--card); padding: 30px; border-radius: 35px; box-shadow: 0 20px 50px rgba(0,0,0,0.08); margin: 20px 0; }
        .header { text-align: center; margin-bottom: 30px; border-bottom: 2px solid #f1f5f9; padding-bottom: 20px; }
        .header h2 { margin: 0; color: #1e1b4b; font-size: 1.6rem; letter-spacing: 1px; }
        .section-box { background: #f8fafb; padding: 20px; border-radius: 20px; margin-bottom: 25px; border-left: 6px solid var(--primary); }
        .student-part { background: #fffbeb; border-left-color: var(--accent); }
        .section-title { font-weight: 800; color: #1e293b; margin-bottom: 15px; display: block; font-size: 1rem; }
        label { display: block; font-weight: 700; margin-bottom: 8px; color: #475569; font-size: 0.9rem; }
        input, textarea, select { width: 100%; padding: 14px; border: 2px solid #e2e8f0; border-radius: 14px; font-size: 1rem; box-sizing: border-box; transition: 0.3s; background: white; }
        input:focus, textarea:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1); }
        .score-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .btn-submit { width: 100%; padding: 20px; background: var(--primary); color: white; border: none; border-radius: 20px; font-weight: 800; font-size: 1.1rem; cursor: pointer; margin-top: 10px; box-shadow: 0 10px 20px rgba(79, 70, 229, 0.2); transition: 0.3s; }
    </style>
</head>
<body>
<div class="app-container">
    <div class="header">
        <h2><i class="fas fa-file-signature"></i> 課後成長紀錄卡</h2>
        <p style="color: #64748b; font-size: 14px; margin-top: 8px;">專業導師：Eric 陳老師</p>
    </div>

    <div class="input-group" style="margin-bottom: 25px;">
        <label>選擇學生名單</label>
        <select id="sInfo">
            <option value="" data-grade="">點擊選擇學生...</option>
            <option value="吳芮瑀" data-grade="國一">吳芮瑀 (國一)</option>
            <option value="許恩碩" data-grade="國一">許恩碩 (國一)</option>
            <option value="張棨富" data-grade="國二">張棨富 (國二)</option>
            <option value="王竑傑" data-grade="國小">王竑傑 (國小)</option>
            <option value="程議正" data-grade="國一">程議正 (國一)</option>
            <option value="黃子恩" data-grade="國小">黃子恩 (國小)</option>
            <option value="吳宥彥" data-grade="國三">吳宥彥 (國三)</option>
            <option value="黃子祐" data-grade="國一">黃子祐 (國一)</option>
        </select>
    </div>

    <div class="section-box student-part">
        <span class="section-title" style="color: #b45309;"><i class="fas fa-user-graduate"></i> 學生深度自評</span>
        <div class="score-grid">
            <div class="input-group"><label>今日信心 (1-10)</label><input type="number" id="sScore" min="1" max="10"></div>
            <div class="input-group"><label>難度感覺 (1-10)</label><input type="number" id="diffScore" min="1" max="10"></div>
        </div>
        <div class="input-group" style="margin-top: 15px;">
            <label>今天哪個「環節」最卡關？</label>
            <textarea id="sComment" rows="2" placeholder="學生簡述..."></textarea>
        </div>
    </div>

    <div class="section-box">
        <span class="section-title"><i class="fas fa-chalkboard-teacher"></i> 老師專業觀察</span>
        <div class="input-group"><label>今日進度單元</label><input type="text" id="progress" placeholder="如：3-2 比例式"></div>
        <div class="input-group" style="margin-top: 15px;"><label>觀察掌握度 (1-10)</label><input type="number" id="tScore" min="1" max="10"></div>
        <div class="input-group" style="margin-top: 15px;"><label>關鍵弱點與教學對策</label><textarea id="weakness" rows="3"></textarea></div>
    </div>

    <div class="input-group"><label><i class="fas fa-tasks"></i> 下次上課前任務 (Todo)</label><textarea id="todo" rows="3"></textarea></div>
    <button class="btn-submit" onclick="submitDaily()">產出紀錄並通知家長 <i class="fas fa-magic"></i></button>
</div>

<script>
    function submitDaily() {
        // 使用您提供的最新部署網址
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwsIzKsk-y25Fp0SF-Y0FU7d6cp4dzw76n8hk3N-poQ3-nygp7KzEG_KI2XLTlJGFAUIA/exec';
        const select = document.getElementById('sInfo');
        const selectedOption = select.options[select.selectedIndex];
        
        if(!select.value) return alert("請先選擇學生！");

        const data = {
            name: select.value,
            grade: selectedOption.getAttribute('data-grade'),
            progress: document.getElementById('progress').value,
            sScore: document.getElementById('sScore').value,
            tScore: document.getElementById('tScore').value,
            // 合併學生自評與老師評論到 weakness 欄位，方便後端寫入與寄信
            weakness: "【學生自評】：難度 " + document.getElementById('diffScore').value + " 分，卡關點：" + document.getElementById('sComment').value + "\n【老師點評】：" + document.getElementById('weakness').value,
            todo: document.getElementById('todo').value,
            type: "DAILY_FEEDBACK"
        };

        if(!data.progress) return alert("請填寫今日進度單元！");
        
        const btn = document.querySelector('.btn-submit');
        btn.disabled = true; 
        btn.innerText = "正在同步數據...";

        fetch(scriptURL, { 
            method: 'POST', 
            mode: 'no-cors', 
            body: JSON.stringify(data) 
        })
        .then(() => { 
            alert("✅ " + data.name + " 的教學紀錄已成功送達家長信箱！"); 
            location.reload(); 
        })
        .catch((err) => { 
            console.error(err);
            alert("發送失敗，請檢查網路連線！"); 
            btn.disabled = false; 
            btn.innerText = "產出紀錄並通知家長";
        });
    }
</script>
</body>
</html>
