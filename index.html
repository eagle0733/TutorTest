<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning DNA | 專業學習力診斷系統</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --primary: #6366f1; --secondary: #a855f7; --bg: #f8fafc; --text: #1e293b; }
        body { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; overflow-x: hidden; }
        
        /* 玻璃噴砂容器 */
        .container { width: 100%; max-width: 850px; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(15px); padding: 45px; border-radius: 40px; box-shadow: 0 40px 100px rgba(0,0,0,0.3); position: relative; border: 1px solid rgba(255,255,255,0.3); }
        
        /* 標題動畫 */
        .header h1 { font-size: 2.6rem; color: #312e81; margin: 0; font-weight: 900; letter-spacing: 1px; }
        .typing { border-right: 3px solid var(--primary); white-space: nowrap; overflow: hidden; display: inline-block; animation: typing 2s steps(20, end), blink .75s step-end infinite; }
        @keyframes typing { from { width: 0 } to { width: 100% } }
        @keyframes blink { from, to { border-color: transparent } 50% { border-color: var(--primary) } }

        /* 卡片與進度 */
        .card { display: none; }
        .card.active { display: block; animation: fadeIn 0.8s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .progress-bar { height: 12px; background: #e2e8f0; border-radius: 20px; margin: 20px 0 40px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #6366f1, #a855f7); width: 0%; transition: 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }

        /* 輸入框美化 */
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
        input, select { width: 100%; padding: 16px; border: 2px solid #f1f5f9; border-radius: 16px; font-size: 1rem; outline: none; transition: 0.3s; box-sizing: border-box; background: #f8fafc; }
        input:focus { border-color: var(--primary); background: white; box-shadow: 0 0 0 5px rgba(99, 102, 241, 0.1); }

        /* 題目選項區 */
        .question-box { background: white; padding: 35px; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.03); margin-bottom: 30px; text-align: center; border: 1px solid #f1f5f9; }
        .question-text { font-size: 1.6rem; color: #1e1b4b; font-weight: 800; line-height: 1.5; min-height: 90px; }
        .options { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-top: 25px; }
        .opt-btn { padding: 18px 5px; background: #f8fafc; border: 2.5px solid transparent; border-radius: 15px; cursor: pointer; transition: 0.2s; font-size: 0.95rem; font-weight: 700; color: #64748b; }
        .opt-btn:hover { background: #eff6ff; color: var(--primary); border-color: #dbeafe; }
        .opt-btn.selected { background: var(--primary); color: white; transform: translateY(-5px); box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3); }

        /* 底部按鈕 */
        .nav-btns { display: flex; justify-content: space-between; align-items: center; margin-top: 40px; }
        .btn { padding: 16px 35px; border-radius: 18px; border: none; font-weight: 800; cursor: pointer; transition: 0.3s; font-size: 1rem; display: flex; align-items: center; gap: 10px; }
        .btn-prev { background: #f1f5f9; color: #64748b; }
        .btn-next { background: var(--primary); color: white; box-shadow: 0 10px 25px rgba(99, 102, 241, 0.3); }
        .btn-next:hover:not(:disabled) { transform: scale(1.05); filter: brightness(1.1); }
        
        /* 預約按鈕特效 */
        .btn-line { background: #06C755; color: white; position: relative; overflow: hidden; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(6, 199, 85, 0.4); } 70% { box-shadow: 0 0 0 15px rgba(6, 199, 85, 0); } 100% { box-shadow: 0 0 0 0 rgba(6, 199, 85, 0); } }

        /* 結果分析排版 */
        .report-grid { display: grid; grid-template-columns: 1fr 1.2fr; gap: 40px; margin: 30px 0; }
        .analysis-card { background: #f8fafc; padding: 30px; border-radius: 30px; border-left: 8px solid var(--primary); }
        .advice-box { background: white; border-radius: 20px; padding: 20px; margin-top: 20px; border: 1px solid #e2e8f0; line-height: 1.7; }

        @media (max-width: 768px) { .info-grid, .report-grid { grid-template-columns: 1fr; } .options { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="container">
    <div id="step-info" class="card active">
        <div style="text-align: center; margin-bottom: 40px;">
            <h1 class="typing">Learning DNA</h1>
            <p style="color: #64748b; font-weight: 600; margin-top: 15px;">🔍 透過 30 項維度，鎖定孩子的學習成長關鍵</p>
        </div>
        <div class="info-grid">
            <input type="text" id="uName" placeholder="學生姓名">
            <select id="uGrade"><option value="">目前年級</option><option>國小</option><option>國一</option><option>國二</option><option>國三</option></select>
            <input type="email" id="uEmail" placeholder="電子信箱 (發送完整報告)">
            <input type="text" id="uLine" placeholder="LINE ID / 手機號碼">
        </div>
        <div style="text-align: center; margin-top: 30px;">
            <button class="btn btn-next" style="margin: auto;" onclick="start()">開始深度分析 <i class="fas fa-chevron-right"></i></button>
        </div>
    </div>

    <div id="step-quiz" class="card">
        <div class="progress-container">
            <div style="display: flex; justify-content: space-between; font-weight: 800; color: var(--primary);">
                <span id="secTitle">第一階段：自律執行力</span>
                <span id="qCount">1 / 30</span>
            </div>
            <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        </div>
        
        <div class="question-box">
            <div id="qText" class="question-text">載入中...</div>
            <div id="qOptions" class="options"></div>
        </div>

        <div class="nav-btns">
            <button class="btn btn-prev" onclick="move(-1)"><i class="fas fa-undo"></i> 回上一題</button>
            <button class="btn btn-next" id="nextBtn" onclick="move(1)" disabled>下一題 <i class="fas fa-arrow-right"></i></button>
        </div>
    </div>

    <div id="resultPage" class="card">
        <div style="text-align: center;">
            <span id="rIcon" style="font-size: 80px; display: block; margin-bottom: 10px;"></span>
            <h2 id="rTitle" style="color: var(--primary); font-size: 2.5rem; margin: 0;"></h2>
            <p id="rSub" style="color: #64748b; font-weight: 700; font-size: 1.1rem;"></p>
        </div>

        <div class="report-grid">
            <div><canvas id="radarChart"></canvas></div>
            <div class="analysis-card">
                <h4 style="margin:0; font-size: 1.3rem; color: #1e1b4b;"><i class="fas fa-microscope"></i> 學習基因分析</h4>
                <p id="rDesc" style="color: #475569; margin: 20px 0; font-size: 1rem;"></p>
                <div class="advice-box">
                    <strong style="color: var(--primary);"><i class="fas fa-lightbulb"></i> Eric 老師的專業建議：</strong><br>
                    <span id="rAdvice" style="font-size: 0.95rem; color: #334155;"></span>
                </div>
            </div>
        </div>

        <div style="text-align: center; border-top: 2px solid #f1f5f9; padding-top: 35px;">
            <p style="color: #64748b; margin-bottom: 25px; font-weight: 600;">根據診斷結果，孩子在部分領域有極大提升空間。建議與老師一對一討論。</p>
            <div style="display: flex; justify-content: center; gap: 20px; flex-wrap: wrap;">
                <button class="btn btn-line" onclick="window.location.href='https://line.me/ti/p/t5IOi2kxpX'">
                    <i class="fab fa-line fa-lg"></i> 與老師進行深度解析
                </button>
                <button class="btn btn-prev" onclick="location.reload()">重新檢測</button>
            </div>
        </div>
    </div>
</div>

<script>
    const questions = [
        // A 自律 1-10
        { q: "放學後，我能不需提醒就主動完成當日預定的學習任務。", d: "A", r: false },
        { q: "面對枯燥的複習內容，我依然能維持穩定的專注度。", d: "A", r: false },
        { q: "我有記錄學習進度或使用日程表的習慣。", d: "A", r: false },
        { q: "遇到卡關的難題，我傾向獨立思考而非立即尋求答案。", d: "A", r: false },
        { q: "一旦手機放在視線範圍內，我的學習效率會大幅下降。", d: "A", r: true },
        { q: "我能將學習環境整理得井然有序，確保不受雜物干擾。", d: "A", r: false },
        { q: "對於長期的考試目標，我能拆解成每日執行的計畫。", d: "A", r: false },
        { q: "我習慣在睡前檢查隔天所需的課程物資與講義。", d: "A", r: false },
        { q: "我常在截止日期前一刻才感到壓力並倉促完成作業。", d: "A", r: true },
        { q: "我能克制娛樂慾望，確保完成學習目標後的獎勵感。", d: "A", r: false },
        // B 邏輯 11-20
        { q: "比起背誦現成的公式，我更喜歡探究背後的推導原理。", d: "B", r: false },
        { q: "面對新概念，我能迅速聯想到過去學過的相關知識。", d: "B", r: false },
        { q: "我能從繁雜的題目敘述中，精確萃取出核心邏輯條件。", d: "B", r: false },
        { q: "我對於數字變化、圖表趨勢的敏感度高於文字描述。", d: "B", r: false },
        { q: "聽完老師講解後，我能用自己的話重新建構邏輯給他人聽。", d: "B", r: false },
        { q: "我喜歡拆解事物運作的規律，而非單純接受既定事實。", d: "B", r: false },
        { q: "我覺得課本上的文字描述過於抽象，難以產生具體畫面感。", d: "B", r: true },
        { q: "在解題時，我更在意解法的多樣性而非單一標準答案。", d: "B", r: false },
        { q: "我能快速識破陷阱題中隱藏的邏輯矛盾。", d: "B", r: false },
        { q: "相對於靈活應用，我更擅長處理重複性高的基本練習。", d: "B", r: true },
        // C 心理 21-30
        { q: "我對學習新領域保有強烈的好奇心，並視其為自我成長。", d: "C", r: false },
        { q: "成績起伏不會影響我對該學科長期投入的熱情。", d: "C", r: false },
        { q: "我敢於在課堂上暴露自己的盲點並提出深度質疑。", d: "C", r: false },
        { q: "在大考場合下，我常感到生理性焦慮並導致實力受限。", d: "C", r: true },
        { q: "我能從錯誤中分析成因，而非糾結於分數的損失。", d: "C", r: false },
        { q: "解決高難度挑戰所帶來的滿足感遠超學習時的辛勞。", d: "C", r: false },
        { q: "面對未曾見過的題型，我會感到興奮並嘗試解構。", d: "C", r: false },
        { q: "當連續遇到幾題挫折時，我會產生「我不適合這科」的念頭。", d: "C", r: true },
        { q: "我更在意自己掌握知識的程度，而非在班級中的排名。", d: "C", r: false },
        { q: "我認為失敗是獲取反饋的必經路徑，能平靜看待挫折。", d: "C", r: false }
    ];

    let current = 0, ans = new Array(30).fill(null), user = {};

    function start() {
        const mail = document.getElementById('uEmail').value;
        const name = document.getElementById('uName').value;
        if(!name || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(mail)) return alert("請輸入完整姓名與正確的電子信箱！");
        user = { name, email: mail, grade: document.getElementById('uGrade').value, line: document.getElementById('uLine').value };
        document.getElementById('step-info').classList.remove('active');
        document.getElementById('step-quiz').classList.add('active');
        render();
    }

    function render() {
        const q = questions[current];
        document.getElementById('qText').innerText = q.q;
        document.getElementById('qCount').innerText = `${current + 1} / 30`;
        document.getElementById('progressFill').style.width = `${((current + 1)/30)*100}%`;
        document.getElementById('secTitle').innerText = ["自律執行力", "邏輯吸收力", "心理韌性度"][Math.floor(current/10)];
        
        const opts = document.getElementById('qOptions');
        opts.innerHTML = '';
        ['極不符合','稍不符合','普通','符合','極符合'].forEach((t, i) => {
            const b = document.createElement('div');
            b.className = `opt-btn ${ans[current] === i+1 ? 'selected' : ''}`;
            b.innerText = t;
            b.onclick = () => { ans[current] = i+1; render(); if(current < 29) setTimeout(() => move(1), 250); };
            opts.appendChild(b);
        });
        document.getElementById('nextBtn').disabled = !ans[current];
    }

    function move(n) {
        if(current + n < 0) return;
        if(current + n >= 30) return finish();
        current += n;
        render();
    }

    function finish() {
        let sc = {A:0, B:0, C:0};
        questions.forEach((q, i) => { let v = ans[i]; if(q.r) v = 6-v; sc[q.d]+=v; });
        const pA = sc.A*2, pB = sc.B*2, pC = sc.C*2;
        
        document.getElementById('step-quiz').classList.remove('active');
        document.getElementById('resultPage').classList.add('active');

        const res = getRes(pA, pB, pC);
        document.getElementById('rIcon').innerText = res.i;
        document.getElementById('rTitle').innerText = res.t;
        document.getElementById('rSub').innerText = res.s;
        document.getElementById('rDesc').innerText = res.d;
        document.getElementById('rAdvice').innerText = res.a;

        const ctx = document.getElementById('radarChart').getContext('2d');
        new Chart(ctx, {
            type: 'radar',
            data: {
                labels: ['自律執行', '邏輯吸收', '心理韌性'],
                datasets: [{
                    data: [pA, pB, pC],
                    backgroundColor: 'rgba(99, 102, 241, 0.25)',
                    borderColor: '#6366f1',
                    borderWidth: 4,
                    pointBackgroundColor: '#6366f1'
                }]
            },
            options: { scales: { r: { min: 0, max: 100, ticks: { display: false } } }, plugins: { legend: { display: false } } }
        });

        // 串接您的 GAS
        const scriptURL = 'https://script.google.com/macros/s/AKfycbzz3VLddJWTzBTbUFOeVPlKuYcLK9EMjN0hqSmZX4POdWNAMuS_lt0hh6NrIxPOyEmK4w/exec';
        fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({...user, scoreA:pA, scoreB:pB, scoreC:pC, type:res.t}) });
    }

    function getRes(a, b, c) {
        if(a>=75 && b>=75) return { i:"🦅", t:"領航獵鷹 (Elite)", s:"頂尖自律與邏輯的領跑者", d:"具備強大的自主學習天賦，能高效處理複雜資訊。這類學生在傳統課堂中常感到「吃不飽」，需要更高階的挑戰來維持動力。", a:"目前的難度已不足以支撐他的成長，建議引入跨年級教材或競賽邏輯。請務必聯繫老師，為孩子規劃『超越同儕』的進階路徑。" };
        if(b>=70) return { i:"🐒", t:"閃電靈猴 (Intuitive)", s:"反應極快但容易跳躍的聰明者", d:"腦袋動得比手快，直覺極強，但常因忽略細節而「聽懂卻考不出」。在靈活題型表現出色，但在繁瑣的運算中容易失分。", a:"他需要的不是重複練習，而是『邏輯減速』與 SOP 化。透過老師的引導，能將他的靈感轉化為穩定的得分力。建議儘速預約面談，解決『粗心大意』的頑疾。" };
        if(a>=70) return { i:"🐘", t:"堅毅石象 (Pragmatic)", s:"踏實勤奮但思考較固定的執行者", d:"是老師眼中的模範生，態度認真且作業準時。然而當遇到從未見過的創新題型時，會因為過度依賴公式而卡關，產生嚴重的挫折感。", a:"他的努力值得肯定，但需要『思維鬆土』。我會帶領他從公式背後的原理開始推導，打破僵化思維。歡迎預約試聽，我將展示如何讓勤奮轉化為高效率。" };
        return { i:"✨", t:"潛力星火 (Spark)", s:"等待被點燃與引導的探索者", d:"目前學習節奏尚未建立，對於困難學科有逃避傾向，心理負荷度較低。這並非孩子不夠優秀，而是尚未找到獲得成就感的「切入點」。", a:"現在最需要的不是壓力，而是『成功體驗』。我會透過拆解式教學讓孩子重拾信心。請聯絡老師，讓我們一起找出點燃孩子學習動力的關鍵火種。" };
    }
</script>
</body>
</html>
