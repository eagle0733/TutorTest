<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學力原點 | 專業深度診斷系統</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --primary: #6366f1; --secondary: #a855f7; --bg: #f8fafc; --text: #1e293b; }
        body { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; overflow-x: hidden; }
        .container { width: 100%; max-width: 850px; background: rgba(255, 255, 255, 0.96); backdrop-filter: blur(20px); padding: 45px; border-radius: 40px; box-shadow: 0 40px 100px rgba(0,0,0,0.3); position: relative; border: 1px solid rgba(255,255,255,0.4); }
        .header h1 { font-size: 2.4rem; color: #312e81; margin: 0; font-weight: 900; letter-spacing: 2px; }
        .typing { border-right: 3px solid var(--primary); white-space: nowrap; overflow: hidden; display: inline-block; animation: typing 2.5s steps(25, end), blink .75s step-end infinite; }
        @keyframes typing { from { width: 0 } to { width: 100% } }
        @keyframes blink { from, to { border-color: transparent } 50% { border-color: var(--primary) } }
        .card { display: none; }
        .card.active { display: block; animation: slideUp 0.7s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .progress-bar { height: 12px; background: #e2e8f0; border-radius: 20px; overflow: hidden; margin-top: 15px; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #6366f1, #a855f7); width: 0%; transition: 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .input-group label { display: block; font-size: 0.85rem; font-weight: 800; color: #4338ca; margin-bottom: 8px; }
        input, select { width: 100%; padding: 15px; border: 2.5px solid #f1f5f9; border-radius: 16px; font-size: 1rem; outline: none; transition: 0.3s; box-sizing: border-box; background: #f8fafc; }
        input:focus { border-color: var(--primary); background: white; box-shadow: 0 0 0 5px rgba(99, 102, 241, 0.1); }
        .question-box { background: white; padding: 35px; border-radius: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.04); margin-bottom: 30px; text-align: center; border: 1px solid #f1f5f9; }
        .question-text { font-size: 1.6rem; color: #1e1b4b; font-weight: 800; line-height: 1.6; min-height: 90px; display: flex; align-items: center; justify-content: center; }
        .options { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-top: 25px; }
        .opt-btn { padding: 18px 5px; background: #f8fafc; border: 2.5px solid transparent; border-radius: 15px; cursor: pointer; transition: 0.2s; font-size: 0.95rem; font-weight: 700; color: #64748b; }
        .opt-btn:hover { background: #eff6ff; color: var(--primary); border-color: #dbeafe; }
        .opt-btn.selected { background: var(--primary); color: white; transform: translateY(-5px); box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3); }
        .nav-btns { display: flex; justify-content: space-between; align-items: center; margin-top: 40px; }
        .btn { padding: 16px 35px; border-radius: 18px; border: none; font-weight: 800; cursor: pointer; transition: 0.3s; font-size: 1rem; display: flex; align-items: center; gap: 10px; }
        .btn-prev { background: #f1f5f9; color: #64748b; }
        .btn-next { background: var(--primary); color: white; box-shadow: 0 10px 25px rgba(99, 102, 241, 0.3); }
        .btn-submit { background: linear-gradient(90deg, #ef4444, #f59e0b); color: white; }
        .btn-line { background: #06C755; color: white; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(6, 199, 85, 0.4); } 70% { box-shadow: 0 0 0 15px rgba(6, 199, 85, 0); } 100% { box-shadow: 0 0 0 0 rgba(6, 199, 85, 0); } }
        .report-grid { display: grid; grid-template-columns: 1fr 1.2fr; gap: 40px; margin: 30px 0; align-items: center; }
        .analysis-card { background: #f8fafc; padding: 30px; border-radius: 30px; border-left: 8px solid var(--primary); text-align: left; }
        .advice-box { background: white; border-radius: 20px; padding: 25px; margin-top: 20px; border: 1.5px dashed #cbd5e1; line-height: 1.8; color: #334155; }
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); backdrop-filter: blur(5px); z-index:1000; align-items:center; justify-content:center; }
        .modal-content { background:white; padding:40px; border-radius:30px; text-align:center; max-width:400px; box-shadow:0 20px 50px rgba(0,0,0,0.3); animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @media (max-width: 768px) { .info-grid, .report-grid { grid-template-columns: 1fr; } .options { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div id="confirmModal" class="modal">
    <div class="modal-content">
        <i class="fas fa-check-circle" style="font-size: 50px; color: #10b981; margin-bottom: 20px;"></i>
        <h3 style="margin:0; color:#1e1b4b;">確認完成診斷？</h3>
        <p style="color:#64748b; line-height:1.6;">點擊確認後，系統將計算得分並將精美報告同步寄送到您的信箱。</p>
        <div style="display:flex; gap:10px; margin-top:30px;">
            <button class="btn btn-prev" style="flex:1;" onclick="closeModal()">返回檢查</button>
            <button class="btn btn-next" style="flex:1;" onclick="finalSubmit()">確認提交</button>
        </div>
    </div>
</div>

<div class="container">
    <div id="step-info" class="card active">
        <div style="text-align: center; margin-bottom: 45px;">
            <h1 class="typing">學力原點・深度診斷系統</h1>
            <p style="color: #64748b; font-weight: 600; margin-top: 20px;">🔍 排除學習干擾、精確定位痛點，找回孩子的學習初衷</p>
        </div>
        <div class="info-grid">
            <div class="input-group"><label>學生姓名</label><input type="text" id="uName" placeholder="請輸入姓名"></div>
            <div class="input-group"><label>目前年級</label>
                <select id="uGrade"><option value="">請選擇</option><option>國小</option><option>國一</option><option>國二</option><option>國三</option><option>高中</option></select>
            </div>
            <div class="input-group"><label>電子信箱 (接收診斷報告)</label><input type="email" id="uEmail" placeholder="example@mail.com"></div>
            <div class="input-group"><label>LINE ID / 手機號碼</label><input type="text" id="uLine" placeholder="以便老師聯繫解析"></div>
            <div class="input-group"><label>擅長科目</label><input type="text" id="uStrong" placeholder="孩子較有自信的學科"></div>
            <div class="input-group"><label>弱勢科目</label><input type="text" id="uWeak" placeholder="孩子感到挫折的學科"></div>
        </div>
        <div style="text-align: center; margin-top: 30px;">
            <button class="btn btn-next" style="margin: auto;" onclick="start()">開始深度分析 <i class="fas fa-rocket"></i></button>
        </div>
    </div>

    <div id="step-quiz" class="card">
        <div class="progress-container">
            <div style="display: flex; justify-content: space-between; font-weight: 900; color: var(--primary);">
                <span id="secTitle">第一階段：自律執行力</span>
                <span id="qCount">1 / 30</span>
            </div>
            <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        </div>
        <div class="question-box">
            <div id="qText" class="question-text">載入中...</div>
            <div id="qOptions" class="options"></div>
        </div>
        <div class="nav-btns">
            <button class="btn btn-prev" onclick="move(-1)"><i class="fas fa-undo"></i> 回上一題</button>
            <button class="btn btn-next" id="nextBtn" onclick="handleNext()">下一題 <i class="fas fa-arrow-right"></i></button>
        </div>
    </div>

    <div id="resultPage" class="card">
        <div style="text-align: center; margin-bottom: 20px;">
            <span id="rIcon" style="font-size: 85px; display: block; margin-bottom: 10px;"></span>
            <h2 id="rTitle" style="color: var(--primary); font-size: 2.6rem; margin: 0; font-weight: 900;"></h2>
            <p id="rSub" style="color: #4338ca; font-weight: 800; font-size: 1.2rem; margin-top: 5px;"></p>
        </div>
        <div class="report-grid">
            <div style="width: 100%; max-width: 380px; margin: auto;"><canvas id="radarChart"></canvas></div>
            <div class="analysis-card">
                <h4 style="margin:0; font-size: 1.4rem; color: #1e1b4b;"><i class="fas fa-microscope"></i> 學習特質診斷</h4>
                <p id="rDesc" style="color: #475569; margin: 20px 0; font-size: 1rem; line-height: 1.7;"></p>
                <div class="advice-box">
                    <strong style="color: var(--primary); font-size: 1.1rem;"><i class="fas fa-lightbulb"></i> Eric 老師的專業對策：</strong><br>
                    <span id="rAdvice" style="display: block; margin-top: 10px;"></span>
                </div>
            </div>
        </div>
        <div style="text-align: center; border-top: 2px solid #f1f5f9; padding-top: 40px; margin-top: 20px;">
            <p style="color: #475569; margin-bottom: 25px; font-weight: 700; font-size: 1.1rem;">診斷報告已同步寄送，建議與老師預約面談以獲取完整解析方案。</p>
            <div style="display: flex; justify-content: center; gap: 20px; flex-wrap: wrap;">
                <button class="btn btn-line" onclick="window.location.href='https://line.me/ti/p/t5IOi2kxpX'">
                    <i class="fab fa-line fa-lg"></i> 預約老師深度面談
                </button>
                <button class="btn btn-prev" onclick="location.reload()">重新檢測</button>
            </div>
        </div>
    </div>
</div>

<script>
    const questions = [
        { q: "放學後，我能不需提醒就主動完成當日預定的學習任務。", d: "A", r: false },
        { q: "面對枯燥的複習內容，我依然能維持穩定的專注度。", d: "A", r: false },
        { q: "我有記錄學習進度或使用日程表的習慣。", d: "A", r: false },
        { q: "遇到卡關的難題，我傾向獨立思考而非立即尋求答案。", d: "A", r: false },
        { q: "一旦手機放在視線範圍內，我的學習效率會大幅下降。", d: "A", r: true },
        { q: "我能將學習環境整理得井然有序，確保不受雜物干擾。", d: "A", r: false },
        { q: "對於長期的考試目標，我能拆解成每日執行的計畫。", d: "A", r: false },
        { q: "我習慣在睡前檢查隔天所需的課程物資與講義。", d: "A", r: false },
        { q: "我常在截止日期前一刻才感到壓力並倉促完成作業。", d: "A", r: true },
        { q: "我能克制娛樂慾望，確保完成學習目標後的獎勵感。", d: "A", r: false },
        { q: "比起背誦現成的公式，我更喜歡探究背後的推導原理。", d: "B", r: false },
        { q: "面對新概念，我能迅速聯想到過去學過的相關知識。", d: "B", r: false },
        { q: "我能從繁雜的題目敘述中，精確萃取出核心邏輯條件。", d: "B", r: false },
        { q: "我對於數字變化、圖表趨勢的敏感度高於文字描述。", d: "B", r: false },
        { q: "聽完老師講解後，我能用自己的話重新建構邏輯給他人聽。", d: "B", r: false },
        { q: "我喜歡拆解事物運作者的規律，而非單純接受既定事實。", d: "B", r: false },
        { q: "我覺得課本上的文字描述過於抽象，難以產生具體畫面感。", d: "B", r: true },
        { q: "在解題時，我更在意解法的多樣性而非單一標準答案。", d: "B", r: false },
        { q: "我能快速識破陷阱題中隱藏的邏輯矛盾。", d: "B", r: false },
        { q: "相對於靈活應用，我更擅長處理重複性高的基本練習。", d: "B", r: true },
        { q: "我對學習新領域保有強烈的好奇心，並視其為自我成長。", d: "C", r: false },
        { q: "成績起伏不會影響我對該學科長期投入的熱情。", d: "C", r: false },
        { q: "我敢於在課堂上暴露自己的盲點並提出深度質疑。", d: "C", r: false },
        { q: "在大考場合下，我常感到生理性焦慮並導致實力受限。", d: "C", r: true },
        { q: "我能從錯誤中分析成因，而非糾結於分數的損失。", d: "C", r: false },
        { q: "解決高難度挑戰所帶來的滿足感遠超學習時的辛勞。", d: "C", r: false },
        { q: "面對未曾見過的題型，我會感到興奮並嘗試解構。", d: "C", r: false },
        { q: "當連續遇到幾題挫折時，我會產生「我不適合這科」的念頭。", d: "C", r: true },
        { q: "我更在意自己掌握知識的程度，而非在班級中的排名。", d: "C", r: false },
        { q: "我認為失敗是獲取反饋的必經路徑，能平靜看待挫折。", d: "C", r: false }
    ];

    let cur = 0, ans = new Array(30).fill(null), userData = {};

    function start() {
        const mail = document.getElementById('uEmail').value;
        const name = document.getElementById('uName').value;
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if(!name || !emailRegex.test(mail)) return alert("請填寫正確的姓名與電子信箱！");
        userData = { name, email: mail, grade: document.getElementById('uGrade').value, line: document.getElementById('uLine').value, strong: document.getElementById('uStrong').value, weak: document.getElementById('uWeak').value };
        document.getElementById('step-info').classList.remove('active');
        document.getElementById('step-quiz').classList.add('active');
        render();
    }

    function render() {
        const q = questions[cur];
        document.getElementById('qText').innerText = q.q;
        document.getElementById('qCount').innerText = `${cur + 1} / 30`;
        document.getElementById('progressFill').style.width = `${((cur + 1)/30)*100}%`;
        document.getElementById('secTitle').innerText = ["第一階段：自律執行力", "第二階段：邏輯吸收力", "第三階段：心理韌性度"][Math.floor(cur/10)];
        const container = document.getElementById('qOptions');
        container.innerHTML = '';
        ['極不符合','稍不符合','普通','符合','極符合'].forEach((t, i) => {
            const b = document.createElement('div');
            b.className = `opt-btn ${ans[cur] === i+1 ? 'selected' : ''}`;
            b.innerText = t;
            b.onclick = () => { ans[cur] = i+1; render(); if(cur < 29) setTimeout(() => move(1), 250); };
            container.appendChild(b);
        });
        const nextBtn = document.getElementById('nextBtn');
        nextBtn.disabled = !ans[cur];
        if(cur === 29) {
            nextBtn.innerHTML = '產出深度診斷報告 <i class="fas fa-file-signature"></i>';
            nextBtn.className = 'btn btn-next btn-submit';
        } else {
            nextBtn.innerHTML = '下一題 <i class="fas fa-arrow-right"></i>';
            nextBtn.className = 'btn btn-next';
        }
    }

    function move(n) {
        if(cur + n < 0) return;
        cur += n;
        render();
    }

    function handleNext() {
        if(cur === 29) {
            document.getElementById('confirmModal').style.display = 'flex';
        } else {
            move(1);
        }
    }

    function closeModal() {
        document.getElementById('confirmModal').style.display = 'none';
    }

    function finalSubmit() {
        closeModal();
        finish();
    }

    function finish() {
        let sc = {A:0, B:0, C:0};
        questions.forEach((q, i) => { let v = ans[i]; if(q.r) v = 6-v; sc[q.d]+=v; });
        const pA = sc.A*2, pB = sc.B*2, pC = sc.C*2;
        document.getElementById('step-quiz').classList.remove('active');
        document.getElementById('resultPage').classList.add('active');
        const res = getDiagnosis(pA, pB, pC);
        document.getElementById('rIcon').innerText = res.i;
        document.getElementById('rTitle').innerText = res.t;
        document.getElementById('rSub').innerText = res.s;
        document.getElementById('rDesc').innerText = res.d;
        document.getElementById('rAdvice').innerText = res.a;

        new Chart(document.getElementById('radarChart'), {
            type: 'radar',
            data: {
                labels: ['自律執行', '邏輯吸收', '心理韌性'],
                datasets: [{
                    data: [pA, pB, pC],
                    backgroundColor: 'rgba(99, 102, 241, 0.25)',
                    borderColor: '#6366f1',
                    borderWidth: 5,
                    pointBackgroundColor: '#6366f1',
                }]
            },
            options: { scales: { r: { min: 0, max: 100, ticks: { display: false } } }, plugins: { legend: { display: false } } }
        });

        // 已同步至最新網址
        const scriptURL = 'https://script.google.com/macros/s/AKfycbxdXgNvOgADlUgO1UeiN0A-p5SmAYp8_5U5Cc_F0HURthc4YxJWS72rK91pazl21MbMuA/exec';
        fetch(scriptURL, { 
            method: 'POST', 
            mode: 'no-cors', 
            body: JSON.stringify({...userData, scoreA:pA, scoreB:pB, scoreC:pC, type:res.t, type_flag: "DIAGNOSIS"}) 
        });
    }

    function getDiagnosis(a, b, c) {
        if(a >= 70 && b >= 70) return { i:"🦅", t:"領航獵鷹", s:"高精準度、高續航力的頂尖領跑者", d:"具備強大的目標意識與邏輯拆解力。在群體中通常是領先者，但也容易因為環境挑戰性不足而產生「學習倦怠」。", a:"目前的學校進度可能已無法滿足他。建議引入跨年級競賽題或專案式學習。歡迎聯繫 Eric 老師，為孩子規劃高階學習里程碑。" };
        if(b > a && b >= 65) return { i:"🐒", t:"閃電靈猴", s:"直覺敏銳、反應極快但穩定度欠佳", d:"反應靈活，能迅速理解新觀念，但容易在細節與重複性練習中分心。常出現「聽懂了但考不出」的現象。", a:"他需要的是「邏輯減速」與 SOP 化。老師會引導其從直覺轉化為穩定的解題規範。建議家長找我聊聊，解決「粗心大意」的長期頑疾。" };
        if(a > b && a >= 65) return { i:"🐘", t:"堅毅石象", s:"踏實勤奮、執行力強但思考較固定的執行者", d:"執行力極高，是模範生典型。但過度依賴公式與死背，面對靈活變化題型時容易力不從心。", a:"他需要的是「思維鬆土」。老師將透過圖像建模帶領其從原理推導，轉化為高效理解。歡迎預約面談。" };
        return { i:"✨", t:"潛力星火", s:"能量待點燃、需建立成就感的探索者", d:"目前學習動機較散亂，對困難題目有排斥感。這並非孩子不聰明，而是尚未找到成就感的切入點。", a:"建議以「拆解目標」為主，透過小階段成功找回自信，重新點燃學習熱忱。請聯繫老師，我們一起找出點燃孩子火種的關鍵切入點。" };
    }
</script>
</body>
</html>
