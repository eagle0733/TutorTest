<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>學力原點｜學習特質診斷</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

<style>
:root{
    --primary:#2563eb;
    --secondary:#22c55e;
    --bg:#f8fafc;
    --text:#1e293b;
}
body{
    margin:0;
    min-height:100vh;
    background:linear-gradient(135deg,#2563eb,#22c55e);
    font-family:'PingFang TC','Microsoft JhengHei',sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}
.container{
    width:100%;
    max-width:880px;
    background:rgba(255,255,255,.96);
    padding:42px;
    border-radius:36px;
    box-shadow:0 30px 80px rgba(0,0,0,.25);
}
.card{display:none;}
.card.active{display:block;animation:fade .45s ease;}
@keyframes fade{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

h1{
    color:#1e3a8a;
    font-size:2.3rem;
    margin:0;
    font-weight:900;
    text-align:center;
}
.subtitle{
    text-align:center;
    color:#64748b;
    font-weight:700;
    margin:18px 0 35px;
}
.info-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
}
.input-group label{
    display:block;
    font-weight:800;
    color:#1d4ed8;
    margin-bottom:8px;
}
input,select{
    width:100%;
    box-sizing:border-box;
    padding:15px;
    border-radius:15px;
    border:2px solid #e2e8f0;
    font-size:1rem;
    background:#f8fafc;
}
input:focus,select:focus{
    outline:none;
    border-color:var(--primary);
    background:white;
}

.btn{
    border:none;
    padding:15px 30px;
    border-radius:16px;
    font-weight:900;
    cursor:pointer;
    font-size:1rem;
    display:inline-flex;
    align-items:center;
    gap:8px;
}
.btn-next{
    background:var(--primary);
    color:white;
    box-shadow:0 8px 20px rgba(37,99,235,.28);
}
.btn-prev{
    background:#e2e8f0;
    color:#475569;
}
.btn-submit{
    background:linear-gradient(90deg,#f97316,#ef4444);
    color:white;
}
.btn-line{
    background:#06C755;
    color:white;
}

.progress-bar{
    height:12px;
    background:#e2e8f0;
    border-radius:999px;
    overflow:hidden;
    margin-top:12px;
}
.progress-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#2563eb,#22c55e);
    transition:.35s;
}
.topline{
    display:flex;
    justify-content:space-between;
    color:#1d4ed8;
    font-weight:900;
}
.question-box{
    background:white;
    margin:30px 0;
    padding:35px;
    border-radius:26px;
    box-shadow:0 14px 35px rgba(0,0,0,.06);
    border:1px solid #e2e8f0;
}
.question-text{
    min-height:90px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size:1.45rem;
    line-height:1.6;
    font-weight:900;
    color:#172554;
}
.options{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:12px;
    margin-top:28px;
}
.opt-btn{
    padding:16px 5px;
    border-radius:15px;
    text-align:center;
    background:#f8fafc;
    color:#64748b;
    font-weight:800;
    border:2px solid transparent;
    cursor:pointer;
}
.opt-btn:hover{
    background:#eff6ff;
    color:#2563eb;
}
.opt-btn.selected{
    background:#2563eb;
    color:white;
    transform:translateY(-3px);
}
.nav-btns{
    display:flex;
    justify-content:space-between;
    margin-top:30px;
}
.report-grid{
    display:grid;
    grid-template-columns:1fr 1.25fr;
    gap:32px;
    align-items:center;
}
.analysis-card{
    background:#f8fafc;
    border-left:8px solid #2563eb;
    border-radius:24px;
    padding:26px;
    color:#334155;
}
.type-card{
    background:white;
    border-radius:18px;
    padding:16px;
    margin-top:14px;
    border:1px solid #e2e8f0;
}
.score-row{
    display:flex;
    justify-content:space-between;
    font-weight:800;
    margin-bottom:6px;
}
.score-bar{
    height:10px;
    border-radius:999px;
    background:#e2e8f0;
    overflow:hidden;
}
.score-fill{
    height:100%;
    background:linear-gradient(90deg,#2563eb,#22c55e);
}
.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    z-index:1000;
    align-items:center;
    justify-content:center;
}
.modal-content{
    background:white;
    padding:35px;
    border-radius:28px;
    max-width:420px;
    text-align:center;
}
@media(max-width:768px){
    .info-grid,.report-grid{grid-template-columns:1fr;}
    .options{grid-template-columns:1fr;}
    .container{padding:28px;}
}
</style>
</head>

<body>

<div id="confirmModal" class="modal">
    <div class="modal-content">
        <i class="fas fa-check-circle" style="font-size:52px;color:#22c55e;margin-bottom:18px;"></i>
        <h3 style="color:#172554;margin:0;">確認送出診斷？</h3>
        <p style="color:#64748b;line-height:1.7;">系統將根據 6 大能力向度，產出主要學習人格與副人格分析。</p>
        <div style="display:flex;gap:12px;margin-top:25px;">
            <button class="btn btn-prev" style="flex:1;justify-content:center;" onclick="closeModal()">返回檢查</button>
            <button class="btn btn-next" style="flex:1;justify-content:center;" onclick="finalSubmit()">確認提交</button>
        </div>
    </div>
</div>

<div class="container">

<div id="step-info" class="card active">
    <h1>學力原點・學習特質診斷</h1>
    <p class="subtitle">用 30 題找出孩子的學習優勢、卡關原因與適合教學方式</p>

    <div class="info-grid">
        <div class="input-group"><label>學生姓名</label><input id="uName" type="text" placeholder="請輸入姓名"></div>
        <div class="input-group"><label>目前年級</label>
            <select id="uGrade">
                <option value="">請選擇</option>
                <option>國小</option>
                <option>國一</option>
                <option>國二</option>
                <option>國三</option>
                <option>高中</option>
            </select>
        </div>
        <div class="input-group"><label>電子信箱</label><input id="uEmail" type="email" placeholder="example@mail.com"></div>
        <div class="input-group"><label>LINE ID / 手機</label><input id="uLine" type="text" placeholder="方便老師聯繫"></div>
        <div class="input-group"><label>擅長科目</label><input id="uStrong" type="text" placeholder="例如：數學、英文"></div>
        <div class="input-group"><label>弱勢科目</label><input id="uWeak" type="text" placeholder="例如：物理、數學"></div>
    </div>

    <div style="text-align:center;margin-top:35px;">
        <button class="btn btn-next" onclick="start()">開始診斷 <i class="fas fa-arrow-right"></i></button>
    </div>
</div>

<div id="step-quiz" class="card">
    <div class="topline">
        <span id="secTitle">第一階段</span>
        <span id="qCount">1 / 30</span>
    </div>
    <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>

    <div class="question-box">
        <div id="qText" class="question-text"></div>
        <div id="qOptions" class="options"></div>
    </div>

    <div class="nav-btns">
        <button class="btn btn-prev" onclick="move(-1)"><i class="fas fa-undo"></i> 上一題</button>
        <button id="nextBtn" class="btn btn-next" onclick="handleNext()">下一題 <i class="fas fa-arrow-right"></i></button>
    </div>
</div>

<div id="resultPage" class="card">
    <div style="text-align:center;">
        <div id="rIcon" style="font-size:78px;"></div>
        <h2 id="rTitle" style="font-size:2.3rem;color:#1d4ed8;margin:8px 0 0;font-weight:900;"></h2>
        <p id="rSub" style="color:#475569;font-weight:800;font-size:1.15rem;"></p>
    </div>

    <div class="report-grid">
        <div><canvas id="radarChart"></canvas></div>
        <div class="analysis-card">
            <h3 style="margin-top:0;color:#172554;">學習特質診斷</h3>
            <p id="rDesc" style="line-height:1.8;"></p>
            <div class="type-card">
                <strong style="color:#2563eb;">Eric 老師建議：</strong>
                <p id="rAdvice" style="line-height:1.8;margin-bottom:0;"></p>
            </div>
        </div>
    </div>

   <div id="typeRanking" style="margin-top:30px;"></div>
   <div id="typeGuide" style="margin-top:24px;"></div>

    <div style="text-align:center;border-top:2px solid #e2e8f0;margin-top:35px;padding-top:30px;">
        <p style="font-weight:800;color:#475569;">建議預約老師面談，進一步解讀孩子的學習卡點與課程安排。</p>
        <div style="display:flex;justify-content:center;gap:15px;flex-wrap:wrap;">
            <button class="btn btn-line" onclick="window.location.href='https://line.me/ti/p/t5IOi2kxpX'">
                <i class="fab fa-line"></i> 預約老師面談
            </button>
            <button class="btn btn-prev" onclick="location.reload()">重新檢測</button>
        </div>
    </div>
</div>

</div>

<script>
const questions = [
    { q:"面對下週的考試，我通常會先把要讀的範圍分成幾天完成。", d:"plan", r:false },
    { q:"如果沒有人提醒，我也能自己開始今天該做的功課。", d:"plan", r:false },
    { q:"我常常知道要讀書，但不知道該先從哪裡開始。", d:"plan", r:true },
    { q:"我會把大目標拆成比較小、比較容易完成的步驟。", d:"plan", r:false },
    { q:"我容易等到時間快不夠了，才開始緊張處理事情。", d:"plan", r:true },

    { q:"比起直接背答案，我更想知道這個方法為什麼成立。", d:"logic", r:false },
    { q:"遇到新題目時，我會先找題目條件之間的關係。", d:"logic", r:false },
    { q:"老師講完後，我通常可以用自己的話再說一次重點。", d:"logic", r:false },
    { q:"如果題目文字變長，我就容易抓不到真正要問什麼。", d:"logic", r:true },
    { q:"我喜歡把複雜問題拆成幾個小問題來想。", d:"logic", r:false },

    { q:"看到新題型時，我會想試試看不同解法。", d:"creative", r:false },
    { q:"我常常可以把不同單元的觀念連在一起。", d:"creative", r:false },
    { q:"我喜歡有變化的題目，不喜歡只是一直重複同樣步驟。", d:"creative", r:false },
    { q:"遇到沒看過的題目，我通常會先覺得有趣，而不是害怕。", d:"creative", r:false },
    { q:"如果老師給我一個標準解法，我通常不會再想其他可能。", d:"creative", r:true },

    { q:"即使題目很多，我也能穩穩地一題一題完成。", d:"steady", r:false },
    { q:"我做題目時，會注意小細節，避免因粗心失分。", d:"steady", r:false },
    { q:"重複練習同一類題目時，我容易很快失去耐心。", d:"steady", r:true },
    { q:"我適合用固定節奏慢慢累積實力。", d:"steady", r:false },
    { q:"我寫完題目後，通常會檢查一次答案或過程。", d:"steady", r:false },

    { q:"我喜歡和老師或同學討論題目，從對話中釐清想法。", d:"social", r:false },
    { q:"如果我卡住了，我能清楚說出自己是哪一步不懂。", d:"social", r:false },
    { q:"比起自己悶著想，我更適合有人引導我一起整理。", d:"social", r:false },
    { q:"我不太敢問問題，常常怕自己問得很笨。", d:"social", r:true },
    { q:"有人陪我檢討時，我比較容易維持學習動力。", d:"social", r:false },

    { q:"考不好時，我會想知道錯在哪裡，而不是只覺得自己很差。", d:"resilience", r:false },
    { q:"連續幾題錯掉時，我還能繼續冷靜處理下一題。", d:"resilience", r:false },
    { q:"遇到難題時，我容易直接覺得自己不適合這科。", d:"resilience", r:true },
    { q:"我可以接受一開始不會，因為練習後會慢慢進步。", d:"resilience", r:false },
    { q:"考試壓力大時，我常常明明會，卻表現不出來。", d:"resilience", r:true }
];

let cur = 0;
let ans = new Array(questions.length).fill(null);
let userData = {};
let radarChart = null;

const dimensionLabels = {
    plan:"自主規劃",
    logic:"邏輯理解",
    creative:"創意彈性",
    steady:"穩定執行",
    social:"互動表達",
    resilience:"挫折恢復"
};

function start(){
    const name = document.getElementById("uName").value.trim();
    const email = document.getElementById("uEmail").value.trim()
        .replace(/[Ａ-Ｚａ-ｚ０-９＠．＿－]/g, function(s) {
            return String.fromCharCode(s.charCodeAt(0) - 0xFEE0);
        });

    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if(!name){
        alert("請填寫學生姓名！");
        return;
    }

    if(!emailRegex.test(email)){
        alert("請填寫正確的電子信箱！");
        return;
    }

    userData = {
        name,
        email,
        grade: document.getElementById("uGrade").value,
        line: document.getElementById("uLine").value,
        strong: document.getElementById("uStrong").value,
        weak: document.getElementById("uWeak").value
    };

    document.getElementById("step-info").classList.remove("active");
    document.getElementById("step-quiz").classList.add("active");
    render();
}
function render(){
    const q = questions[cur];
    document.getElementById("qText").innerText = q.q;
    document.getElementById("qCount").innerText = `${cur + 1} / ${questions.length}`;
    document.getElementById("progressFill").style.width = `${((cur + 1) / questions.length) * 100}%`;

    const stage = Math.floor(cur / 5) + 1;
    document.getElementById("secTitle").innerText = `第 ${stage} 階段：${dimensionLabels[q.d]}`;

    const options = ["極不符合","稍不符合","普通","符合","極符合"];
    const container = document.getElementById("qOptions");
    container.innerHTML = "";

    options.forEach((text, i)=>{
        const b = document.createElement("div");
        b.className = `opt-btn ${ans[cur] === i + 1 ? "selected" : ""}`;
        b.innerText = text;
        b.onclick = ()=>{
            ans[cur] = i + 1;
            render();
            if(cur < questions.length - 1){
                setTimeout(()=>move(1),180);
            }
        };
        container.appendChild(b);
    });

    const nextBtn = document.getElementById("nextBtn");
    nextBtn.disabled = !ans[cur];

    if(cur === questions.length - 1){
        nextBtn.innerHTML = `產出診斷報告 <i class="fas fa-file-signature"></i>`;
        nextBtn.className = "btn btn-submit";
    }else{
        nextBtn.innerHTML = `下一題 <i class="fas fa-arrow-right"></i>`;
        nextBtn.className = "btn btn-next";
    }
}

function move(n){
    if(cur + n < 0 || cur + n >= questions.length) return;
    cur += n;
    render();
}

function handleNext(){
    if(!ans[cur]){
        alert("請先選擇一個答案！");
        return;
    }
    if(cur === questions.length - 1){
        document.getElementById("confirmModal").style.display = "flex";
    }else{
        move(1);
    }
}

function closeModal(){
    document.getElementById("confirmModal").style.display = "none";
}

function finalSubmit(){
    closeModal();
    finish();
}

function getScores(){
    const raw = {
        plan:0,
        logic:0,
        creative:0,
        steady:0,
        social:0,
        resilience:0
    };

    const count = {
        plan:0,
        logic:0,
        creative:0,
        steady:0,
        social:0,
        resilience:0
    };

    questions.forEach((q,i)=>{
        let v = ans[i];
        if(q.r) v = 6 - v;
        raw[q.d] += v;
        count[q.d] += 1;
    });

    const score = {};
    Object.keys(raw).forEach(k=>{
        score[k] = Math.round((raw[k] / (count[k] * 5)) * 100);
    });

    return score;
}

    const types = [
        {
            key:"eagle",
            icon:"🦅",
            title:"領航老鷹",
            sub:"目標清楚、邏輯強、適合高階挑戰",

        {

        },
        {

        {

        {

        },
        {

            icon:"🐆",
            title:"衝刺黑豹",
            sub:"行動快、企圖心強，適合短期目標刺激",
            score: Math.round(s.plan*0.25 + s.resilience*0.25 + s.creative*0.20 + s.logic*0.15 + s.steady*0.15),
            desc:"孩子適合明確目標與短期衝刺，若能看見成果，動力會快速上升。但要避免只靠一時熱度。",
            advice:"建議設定兩週或一個月的小目標，搭配明確回饋，讓孩子在短期成就中累積長期習慣。"
        },
        {
            key:"spark",
            icon:"✨",
            title:"潛力星火",
            sub:"需要建立信心、節奏與成就感",
            score: Math.round((100-s.plan)*0.25 + (100-s.steady)*0.20 + (100-s.resilience)*0.30 + s.social*0.10 + (100-s.logic)*0.15),
            desc:"孩子目前可能不是能力不足，而是學習節奏、信心或成就感尚未建立。若直接給太高壓任務，可能會更排斥。",
            advice:"建議先從小任務開始，讓孩子快速感受到自己做得到，再逐步提高難度，重建對學習的掌控感。"
        }
    ];

    types.sort((a,b)=>b.score-a.score);

    if(types[0].key === "spark" && types[0].score < 62){
        const nonSpark = types.find(t=>t.key !== "spark");
        const spark = types[0];
        types[0] = nonSpark;
        types[types.indexOf(nonSpark)] = spark;
    }

    return types;
}

function finish(){
    const s = getScores();
    const types = getTypes(s);
    const main = types[0];
    const second = types[1];

    document.getElementById("step-quiz").classList.remove("active");
    document.getElementById("resultPage").classList.add("active");

    document.getElementById("rIcon").innerText = main.icon;
    document.getElementById("rTitle").innerText = `${main.title}`;
    document.getElementById("rSub").innerText = `主要特質：${main.score}%｜副特質：${second.title} ${second.score}%`;
    document.getElementById("rDesc").innerText = main.desc + ` 另外，孩子也帶有「${second.title}」特質，代表學習時可同時參考副人格的引導方式。`;
    document.getElementById("rAdvice").innerText = main.advice;

    renderRanking(types);
    renderRadar(s);

    const scriptURL = "https://script.google.com/macros/s/AKfycbxdXgNvOgADlUgO1UeiN0A-p5SmAYp8_5U5Cc_F0HURthc4YxJWS72rK91pazl21MbMuA/exec";

    const payload = {
        ...userData,

        // 新版六大能力
        plan: s.plan,
        logic: s.logic,
        creative: s.creative,
        steady: s.steady,
        social: s.social,
        resilience: s.resilience,

        // 新版人格結果
        mainType: main.title,
        mainIcon: main.icon,
        mainScore: main.score,
        mainSub: main.sub,
        mainDesc: main.desc,
        mainAdvice: main.advice,

        secondType: second.title,
        secondIcon: second.icon,
        secondScore: second.score,
        secondSub: second.sub,

        // 給舊版 Apps Script 信件模板相容用
        type: main.title,
        icon: main.icon,
        sub: main.sub,
        desc: main.desc,
        advice: main.advice,

        scoreA: s.plan,
        scoreB: s.logic,
        scoreC: s.resilience,

        // 舊版信件若只寫自律/邏輯/心理，會先正常顯示這三項
        oldAName: "自主規劃",
        oldBName: "邏輯理解",
        oldCName: "挫折恢復",

        // 額外備用
        scoreD: s.creative,
        scoreE: s.steady,
        scoreF: s.social,

        type_flag: "DIAGNOSIS_V2"
    };

    fetch(scriptURL, {
        method: "POST",
        mode: "no-cors",
        body: JSON.stringify(payload)
    });
}
function renderRanking(types){
    const box = document.getElementById("typeRanking");
    const main = types[0];
    const second = types[1];

    box.innerHTML = `
        <h3 style="color:#172554;margin-bottom:15px;">最接近的學習特質</h3>
        <div class="type-card">
            <div style="font-size:1.1rem;font-weight:900;color:#1d4ed8;margin-bottom:8px;">
                ${main.icon} 主要特質：${main.title}
            </div>
            <div style="color:#475569;line-height:1.7;">
                ${main.sub}
            </div>
        </div>

        <div class="type-card">
            <div style="font-size:1.1rem;font-weight:900;color:#16a34a;margin-bottom:8px;">
                ${second.icon} 輔助特質：${second.title}
            </div>
            <div style="color:#475569;line-height:1.7;">
                ${second.sub}
            </div>
        </div>
    `;

    renderTypeGuide();
}

        {

function toggleTypeGuide(){
    const content = document.getElementById("typeGuideContent");

    if(content.style.display === "none"){
        content.style.display = "grid";
    }else{
        content.style.display = "none";
    }
}
    

function renderRadar(s){
    if(radarChart) radarChart.destroy();

    radarChart = new Chart(document.getElementById("radarChart"),{
        type:"radar",
        data:{
            labels:["自主規劃","邏輯理解","創意彈性","穩定執行","互動表達","挫折恢復"],
            datasets:[{
                data:[s.plan,s.logic,s.creative,s.steady,s.social,s.resilience],
                backgroundColor:"rgba(37,99,235,.22)",
                borderColor:"#2563eb",
                borderWidth:4,
                pointBackgroundColor:"#2563eb"
            }]
        },
        options:{
            scales:{
                r:{
                    min:0,
                    max:100,
                    ticks:{display:false},
                    pointLabels:{font:{size:14,weight:"bold"}}
                }
            },
            plugins:{legend:{display:false}}
        }
    });
}
