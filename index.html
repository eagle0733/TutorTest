<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning DNA | 專業學習力診斷系統</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --primary: #6366f1; --secondary: #a855f7; --bg: #f3f4f6; --text: #1f2937; --glass: rgba(255, 255, 255, 0.98); }
        body { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .container { width: 100%; max-width: 800px; background: var(--glass); padding: 40px; border-radius: 30px; box-shadow: 0 30px 60px rgba(0,0,0,0.2); position: relative; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 2.2rem; color: #312e81; margin: 0; font-weight: 800; }
        .card { display: none; }
        .card.active { display: block; animation: slideUp 0.6s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
        input, select { width: 100%; padding: 12px; border: 1.5px solid #e5e7eb; border-radius: 12px; font-size: 1rem; outline: none; box-sizing: border-box; }
        .progress-bar { height: 8px; background: #e5e7eb; border-radius: 10px; margin-bottom: 25px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--secondary)); width: 0%; transition: 0.4s; }
        .question-text { font-size: 1.6rem; color: #1e1b4b; margin: 30px 0; font-weight: 800; text-align: center; line-height: 1.4; }
        .option-btn { padding: 18px; background: white; border: 2px solid #f3f4f6; border-radius: 18px; cursor: pointer; transition: 0.25s; font-size: 1.1rem; font-weight: 600; text-align: center; margin-bottom: 10px; }
        .option-btn:hover { border-color: var(--primary); background: #f5f3ff; transform: scale(1.02); }
        #resultPage { text-align: center; }
        .type-icon { font-size: 70px; margin-bottom: 10px; display: block; }
        .report-box { background: #f9fafb; padding: 25px; border-radius: 20px; text-align: left; margin: 20px 0; border: 1px solid #f1f5f9; }
        .btn-main { padding: 15px 45px; background: var(--primary); color: white; border: none; border-radius: 15px; font-weight: 700; cursor: pointer; margin-top: 15px; font-size: 1rem; }
    </style>
</head>
<body>

<div class="container">
    <div id="step-info" class="card active">
        <div class="header"><h1>🧬 Learning DNA</h1><p>專業化學力特質與自律動機診斷系統</p></div>
        <div class="info-grid">
            <input type="text" id="name" placeholder="學生姓名">
            <select id="grade"><option value="">年級</option><option>國小</option><option>國一</option><option>國二</option><option>國三</option></select>
            <input type="text" id="strongSub" placeholder="擅長科目">
            <input type="text" id="weakSub" placeholder="弱勢科目">
            <input type="email" id="email" placeholder="電子信箱">
            <input type="text" id="lineId" placeholder="LINE ID">
        </div>
        <div style="text-align: center;"><button class="btn-main" onclick="startQuiz()">開始深度診斷</button></div>
    </div>

    <div id="step-quiz" class="card">
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <div id="qText" class="question-text">題目載入中...</div>
        <div id="qOptions"></div>
        <p id="qCount" style="text-align: center; color: #9ca3af; margin-top: 20px; font-weight: bold;"></p>
    </div>

    <div id="resultPage" class="card">
        <span id="typeIcon" class="type-icon"></span>
        <h2 id="typeTitle" style="color: var(--primary); font-size: 2.2rem; margin: 0;">分析中...</h2>
        <div style="max-width: 380px; margin: 20px auto;"><canvas id="radarChart"></canvas></div>
        <div class="report-box">
            <p id="typeDesc" style="color: #4b5563; line-height: 1.6;"></p>
            <div id="scoresDisplay" style="font-weight: 800; border-top: 1px solid #e5e7eb; padding-top: 15px; margin-top: 10px;"></div>
        </div>
        <button class="btn-main" onclick="location.reload()">重新檢測</button>
    </div>
</div>

<script>
    const questions = [
        { q: "放學後，我能不需提醒就主動完成當日預定的學習任務。", d: "A", r: false },
        { q: "面對枯燥的複習內容，我依然能維持穩定的專注度。", d: "A", r: false },
        { q: "我有記錄學習進度或使用日程表的習慣。", d: "A", r: false },
        { q: "遇到卡關的難題，我傾向獨立思考而非立即尋求答案。", d: "A", r: false },
        { q: "一旦手機放在視線範圍內，我的學習效率會大幅下降。", d: "A", r: true },
        { q: "我能將學習環境整理得井然有序，確保不受雜物干擾。", d: "A", r: false },
        { q: "對於長期的考試目標，我能拆解成每日執行的計畫。", d: "A", r: false },
        { q: "我習慣在睡前檢查隔天所需的課程物資與講義。", d: "A", r: false },
        { q: "我常在截止日期前一刻才感到壓力並倉促完成作業。", d: "A", r: true },
        { q: "我能克制娛樂慾望，確保完成學習目標後的獎勵感。", d: "A", r: false },
        { q: "比起背誦現成的公式，我更喜歡探究背後的推導原理。", d: "B", r: false },
        { q: "面對新概念，我能迅速聯想到過去學過的相關知識。", d: "B", r: false },
        { q: "我能從繁雜的題目敘述中，精確萃取出核心邏輯條件。", d: "B", r: false },
        { q: "我對於數字變化、圖表趨勢的敏感度高於文字描述。", d: "B", r: false },
        { q: "聽完老師講解後，我能用自己的話重新建構邏輯給他人聽。", d: "B", r: false },
        { q: "我喜歡拆解事物運作的規律，而非單純接受既定事實。", d: "B", r: false },
        { q: "我覺得課本上的文字描述過於抽象，難以產生具體畫面感。", d: "B", r: true },
        { q: "在解題時，我更在意解法的多樣性而非單一標準答案。", d: "B", r: false },
        { q: "我能快速識破陷阱題中隱藏的邏輯矛盾。", d: "B", r: false },
        { q: "相對於靈活應用，我更擅長處理重複性高的基本練習。", d: "B", r: true },
        { q: "我對學習新領域保有強烈的好奇心，並視其為自我成長。", d: "C", r: false },
        { q: "成績起伏不會影響我對該學科長期投入的熱情。", d: "C", r: false },
        { q: "我敢於在課堂上暴露自己的盲點並提出深度質疑。", d: "C", r: false },
        { q: "在大考場合下，我常感到生理性焦慮並導致實力受限。", d: "C", r: true },
        { q: "我能從錯誤中分析成因，而非糾結於分數的損失。", d: "C", r: false },
        { q: "解決高難度挑戰所帶來的滿足感遠超學習時的辛勞。", d: "C", r: false },
        { q: "面對未曾見過的題型，我會感到興奮並嘗試解構。", d: "C", r: false },
        { q: "當連續遇到幾題挫折時，我會產生「我不適合這科」的念頭。", d: "C", r: true },
        { q: "我更在意自己掌握知識的程度，而非在班級中的排名。", d: "C", r: false },
        { q: "我認為失敗是獲取反饋的必經路徑，能平靜看待挫折。", d: "C", r: false }
    ];

    let currentQ = 0, answers = new Array(questions.length).fill(null), user = {};

    function startQuiz() {
        user = { name: document.getElementById('name').value, grade: document.getElementById('grade').value, strong: document.getElementById('strongSub').value, weak: document.getElementById('weakSub').value, email: document.getElementById('email').value, line: document.getElementById('lineId').value };
        if(!user.name || !user.email) return alert("請填寫姓名與信箱！");
        document.getElementById('step-info').classList.remove('active');
        document.getElementById('step-quiz').classList.add('active');
        showQ();
    }

    function showQ() {
        document.getElementById('qText').innerText = questions[currentQ].q;
        document.getElementById('progressFill').style.width = ((currentQ + 1) / questions.length) * 100 + "%";
        document.getElementById('qCount').innerText = `${currentQ + 1} / 30`;
        const container = document.getElementById('qOptions'); container.innerHTML = '';
        ['極不符合', '稍不符合', '普通', '符合', '極符合'].forEach((t, i) => {
            const b = document.createElement('div'); b.className = 'option-btn'; b.innerText = t;
            b.onclick = () => { answers[currentQ] = i+1; if(currentQ < 29) { currentQ++; showQ(); } else { processResults(); } };
            container.appendChild(b);
        });
    }

    function processResults() {
        let sc = {A:0, B:0, C:0};
        questions.forEach((q, i) => { let v = answers[i]; if(q.r) v = 6-v; sc[q.d]+=v; });
        const pA = (sc.A*2), pB = (sc.B*2), pC = (sc.C*2);
        
        document.getElementById('step-quiz').classList.remove('active');
        document.getElementById('resultPage').classList.add('active');
        
        let type = "", icon = "", desc = "";
        if(pA>=75 && pB>=75) { type="領航獵鷹"; icon="🦅"; desc="高自律且高理解，教學應引入高挑戰題。"; }
        else if(pB>=70) { type="閃電靈猴"; icon="🐒"; desc="思維敏捷但穩定度欠佳，需強化精準練習。"; }
        else if(pA>=70) { type="堅毅石象"; icon="🐘"; desc="認真踏實但邏輯死板，建議用圖像化解題。"; }
        else { type="潛力星火"; icon="✨"; desc="正處能量蓄積期，先從小成功建立自信。"; }
        
        document.getElementById('typeIcon').innerText = icon;
        document.getElementById('typeTitle').innerText = type;
        document.getElementById('typeDesc').innerText = desc;
        document.getElementById('scoresDisplay').innerText = `自律: ${pA}% | 邏輯: ${pB}% | 心理: ${pC}%`;
        
        new Chart(document.getElementById('radarChart'), { type: 'radar', data: { labels: ['自律', '邏輯', '心理'], datasets: [{ data: [pA, pB, pC], backgroundColor: 'rgba(99,102,241,0.2)', borderColor: '#6366f1' }] }, options: { scales: { r: { max: 100, min: 0 } } } });
        
        // 傳送到您的 GAS
        const scriptURL = 'https://script.google.com/macros/s/AKfycbzz3VLddJWTzBTbUFOeVPlKuYcLK9EMjN0hqSmZX4POdWNAMuS_lt0hh6NrIxPOyEmK4w/exec';
        fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({...user, scoreA:pA, scoreB:pB, scoreC:pC, type:type}) });
    }
</script>
</body>
</html>
